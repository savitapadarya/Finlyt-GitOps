apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: Finlyt_argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/savitapadarya/Finlyt-GitOps.git
    targetRevision: main
    path: helm/finlyt
  destination:
    server: https://kubernetes.default.svc
    namespace: finlyt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
