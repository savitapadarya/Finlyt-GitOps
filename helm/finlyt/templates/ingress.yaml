{{- if .Values.autoscaling.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "finlyt.fullname" . }}
  labels:
    {{- include "finlyt.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx

  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 80
{{- end }}